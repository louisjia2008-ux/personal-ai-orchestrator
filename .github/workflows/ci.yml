name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node for synthetic PI-5 socket tool tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Install pinned Pi SDK for offline activation contract
        run: npm install --prefix "$RUNNER_TEMP/pi0851" --no-save @earendil-works/pi-coding-agent@0.85.1

      - name: Test
        env:
          PAO_PI_SDK_ROOT: ${{ runner.temp }}/pi0851/node_modules/@earendil-works/pi-coding-agent
        run: python -m pytest -q

      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.sha }}:refs/remotes/origin/pr-base-exact" \
            "${{ github.event.pull_request.head.sha }}:refs/remotes/origin/pr-head-exact"
          git diff --check \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  opencode-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/opencode/package.json

      - name: Install adapter dependencies
        working-directory: integrations/opencode
        run: npm install

      - name: Typecheck and contract tests
        working-directory: integrations/opencode
        run: npm run typecheck

  macos-swift:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift package build
        working-directory: macos/PAOMenuBar
        run: swift build

      - name: Swift package tests
        working-directory: macos/PAOMenuBar
        run: swift test
