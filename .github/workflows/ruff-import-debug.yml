name: Ruff Import Debug

on:
  pull_request:
    paths:
      - "tests/test_delegation_evidence.py"
      - ".github/workflows/ruff-import-debug.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff>=0.6,<1'
      - name: Show Ruff import fix
        run: python -m ruff check tests/test_delegation_evidence.py --select I001 --fix --diff || true
