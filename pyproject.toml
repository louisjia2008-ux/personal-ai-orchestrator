[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "personal-ai-orchestrator"
version = "0.0.1"
description = "Safety-first personal orchestration layer for heterogeneous coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-rerunfailures>=14,<15",
  # Pinned: new ruff releases add lint rules and would turn CI red on unrelated
  # pushes. Bump deliberately and fix any new findings in the same change.
  "ruff==0.16.9",
]
macos-package = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
pao = "personal_ai_orchestrator.cli:main"
pao-client-bridge = "personal_ai_orchestrator.client_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import shared fixtures as `tests.<module>`; make bare `pytest` work
# the same as `python -m pytest` (which adds the cwd to sys.path).
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "flaky: opt-in retry decorator provided by pytest-rerunfailures; the daemon SIGINT shutdown race is the only known consumer in this repo.",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
# Markdown under docs/ holds recorded evidence; keep its code blocks verbatim.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The temporal resolver intentionally uses a dynamic supersedes field; the remaining
# B009 hits are the paired ID accesses in that generic helper. E501 is temporary until
# the integration line is compacted after correctness behavior is accepted.
"src/personal_ai_orchestrator/model_registry.py" = ["B009", "E501"]
# RoutingPolicy is a frozen Pydantic value object, so the default instance is immutable.
"src/personal_ai_orchestrator/scheduler.py" = ["B008", "E501"]
"src/personal_ai_orchestrator/quota_capabilities.py" = ["E501"]
"src/personal_ai_orchestrator/safety_kernel.py" = ["E501"]
"src/personal_ai_orchestrator/worktree_manager.py" = ["E501", "I001"]
"src/personal_ai_orchestrator/execution_controller.py" = ["I001"]
"src/personal_ai_orchestrator/routing_service.py" = ["I001"]
"src/personal_ai_orchestrator/shadow_evidence.py" = ["E501"]
# Embedded TypeScript tool source is intentionally kept readable as its own language.
"src/personal_ai_orchestrator/pi5_tool.py" = ["E501"]
"tests/test_execution_controller.py" = ["I001"]
"tests/test_quota_capabilities.py" = ["E501"]
"tests/test_scheduler_hardening.py" = ["E501"]
"tests/test_safety_kernel_and_verifier.py" = ["E501"]
